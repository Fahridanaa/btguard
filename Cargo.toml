[package]
name = "bt-audio-guard"
version = "0.1.0"
edition = "2024"
description = "Observe Bluetooth audio incidents on PipeWire"

[[bin]]
name = "btguard"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["clock"] }
clap = { version = "4.6.8", features = ["derive"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3.27.0"
